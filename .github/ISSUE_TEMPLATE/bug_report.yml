name: Bug report
description: Report broken capture, export, or adapter behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Security issues belong in a private advisory.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@signetpad/core'
        - '@signetpad/react'
        - '@signetpad/react-native'
        - '@signetpad/vue'
        - '@signetpad/svelte'
        - '@signetpad/renderer-canvas'
        - '@signetpad/renderer-react-native-svg'
        - docs or examples
        - unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal snippet, repository, or list of steps.
    validations:
      required: true
