version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      lint-and-test:
        patterns:
          - prettier
          - typescript
          - vitest
          - turbo
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
